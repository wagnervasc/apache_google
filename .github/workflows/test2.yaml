on:
  workflow_dispatch: 

jobs:
  check-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 👈 This creates the .git folder
      - name: Check PR Approval Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          # Find the PR for the current branch
          PR_STATUS=$(gh pr view "$BRANCH_NAME" --json reviewDecision --jq '.reviewDecision' || echo "NO_PR")
          
          # Check the review decision
          echo "Current PR Status: $PR_STATUS"
          
          if [ "$PR_STATUS" != "APPROVED" ]; then
            echo "Error: Pull Request is not approved (Status: $PR_STATUS)"
            exit 1
          fi
