on:
  workflow_dispatch: 

jobs:
  check-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 👈 This creates the .git folder
      - name: Check PR Approval Status
        id: verify_approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          # Find the PR for the current branch
          #PR_STATUS=$(gh pr view "$BRANCH_NAME" --json reviewDecision --jq '.reviewDecision' || echo "NO_PR")
          #PR_STATUS=$(gh pr view "${{ github.ref_name }}" --json reviewDecision --jq '.reviewDecision // "REVIEW_REQUIRED"')
          PR_DATA=$(gh pr view "${{ github.ref_name }}" --json state,reviewDecision --jq '[.state, (.reviewDecision // "REVIEW_REQUIRED")] | @csv' | tr -d '"')
          
          # If no PR exists at all
          if [ $? -ne 0 ]; then
            echo "No Pull Request found for branch ${{ github.ref_name }}"
            exit 1
          fi
          
          # Split the comma-separated values
          STATE=$(echo $PR_DATA | cut -d',' -f1)
          DECISION=$(echo $PR_DATA | cut -d',' -f2)
      
          echo "Review Decision: $DECISION"

          if [[ "$STATE" == "OPEN" && "$DECISION" == "APPROVED" ]]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "✅ PR is Open and Approved."
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "❌ Requirement not met. (Needs OPEN & APPROVED PR)"
            exit 1
          fi  
          
      - name: Production Deployment
        if: steps.verify_approval.outputs.approved == 'true' # 👈 Only runs if approved
        run: |
          echo "🚀 PR is approved! Deploying to production..."
          
