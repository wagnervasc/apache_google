on:
  workflow_dispatch: 

jobs:
  check-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # 👈 This creates the .git folder
      - name: Check PR Approval Status
        id: verify_approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME=${{ github.ref_name }}
          # Find the PR for the current branch
          #PR_STATUS=$(gh pr view "$BRANCH_NAME" --json reviewDecision --jq '.reviewDecision' || echo "NO_PR")
          PR_STATUS=$(gh pr view "${{ github.ref_name }}" --json reviewDecision --jq '.reviewDecision // "REVIEW_REQUIRED"')

          # If no PR exists at all
          if [ $? -ne 0 ]; then
            echo "No Pull Request found for branch ${{ github.ref_name }}"
            exit 1
          fi
          
          # Check the review decision
          echo "Current PR Status: $PR_STATUS"
          
          if [ "$PR_STATUS" != "APPROVED" ]; then
            echo "❌ Error: This workflow requires an APPROVED Pull Request."
            exit 1
          fi
          if [ "$STATUS" == "APPROVED" ]; then
            echo "✅ PR is approved. Proceeding..."
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Error: This workflow requires an APPROVED Pull Request."
            echo "approved=false" >> $GITHUB_OUTPUT
           exit 1
          fi
      - name: Production Deployment
        if: steps.verify_approval.outputs.approved == 'true' # 👈 Only runs if approved
        run: |
          echo "🚀 PR is approved! Deploying to production..."
          
